name: Model catalog publication contracts

on:
  pull_request:
    paths:
      - application/single_app/model_catalog_*.py
      - application/single_app/static/json/model_capabilities.json
      - application/single_app/static/json/model_catalog*trusted_keys.json
      - application/single_app/static/json/schemas/model_capabilities.schema.json
      - model-catalog/**
      - scripts/publish_model_catalog.py
      - scripts/requirements-model-catalog*.txt
      - functional_tests/test_model_catalog_publication_lifecycle.py
      - .github/workflows/*model-catalog*
      - .github/aw/actions-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-model-catalog-tests.txt
      - name: Verify isolation and promotion contracts
        run: python -m pytest -q functional_tests/test_model_catalog_publication_lifecycle.py
      - name: Verify compiled weekly workflow is current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw --pin v1.2.2
          gh aw compile refresh-model-catalog --no-check-update --no-logo
          git diff --exit-code -- .github/workflows/refresh-model-catalog.lock.yml .github/aw/actions-lock.json
