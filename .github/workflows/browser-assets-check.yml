name: Local browser assets

on:
  push:
    branches: [Development]
  pull_request:
    branches: [Development]
    paths:
      - 'application/**'
      - 'docs/**'
      - 'functional_tests/**'
      - 'ui_tests/**'
      - 'scripts/check_browser_assets.py'
      - '.github/workflows/browser-assets-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Restore normal frontend dependencies
        run: npm --prefix application/v2_ui ci --no-audit --no-fund
      - name: Build V2 assets
        run: npm --prefix application/v2_ui run build
      - name: Install existing test tools
        run: |
          python -m pip install pip==26.0.1
          python -m pip install --build-constraint docker-customization/requirements-build.lock.txt -r ui_tests/requirements.txt
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Enforce source and compiled asset policy
        run: python scripts/check_browser_assets.py --require-v2-build
      - name: Check scanner contracts and real browser loaders
        run: >-
          python -m pytest
          functional_tests/test_browser_assets.py
          ui_tests/test_local_runtime_assets.py
          ui_tests/test_teams_login_template.py
          -q -p no:cacheprovider
