<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon" />
    <title>SimpleChat</title>
    <script>
      // Applied before first paint so a dark-mode user never sees a light flash.
      // Kept inline and dependency-free on purpose; the bundle loads too late for this.
      (function () {
        try {
          var stored = localStorage.getItem('simplechat.v2.theme');
          var colorMode = localStorage.getItem('simplechat.v2.color-mode');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = colorMode === 'system' ? prefersDark : stored ? stored === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          // Custom colors (administrator scheme or the user's own mode), generated by
          // useColorSchemeRuntime from validated #RRGGBB values and cached for first paint.
          var colorCss = localStorage.getItem('simplechat.v2.color-css');
          if (colorCss) {
            var style = document.createElement('style');
            style.id = 'sc-color-scheme';
            style.textContent = colorCss;
            document.head.appendChild(style);
          }
        } catch (e) {
          /* localStorage unavailable (private mode); fall back to the light theme. */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
