# Feature documentation and full-slide explanations; capability snapshot 0.261.398.
# Collection page bodies are generated; keep durable explanations here.
model-routing:
  name: "Model routing and endpoints"
  area: "Platform and operations"
  audience: "Admins"
  summary: "Shares approved AI connections across chat, image, and embedding defaults, with reusable model profiles and explicit per-step Auto selection in V2 orchestration."
  why: "Use this when a deployment needs API Management in front of model services or multiple endpoint choices for different teams. Keep it simple when one approved endpoint is enough, because endpoint sprawl makes governance and troubleshooting harder."
  visual_sections:
    - heading: "Choose an approved model for the work"
      text: >-
        Manual model choice and per-step **Auto** selection solve different needs.
        In V2 orchestration, Auto chooses only from eligible configured catalog
        profiles; it does not discover arbitrary endpoints or approve the plan.
        Endpoint access, model capability, cost, and plan approval remain separate
        decisions.
      media_id: slide-model-routing
  default_state: "Mixed"
  admin_tab: ai-models
  setting_keys:
    - enable_gpt_apim
    - enable_embedding_apim
    - enable_multi_model_endpoints
    - enable_default_model_for_new_conversations
  guides:
    - title: "Choose models for orchestration"
      url: /guides/model-catalog-routing/
    - title: "Configure AI connections"
      url: /guides/configure-ai-connections/
  reference:
    - title: "Model Catalog"
      url: /admin/model-catalog/
    - title: "Admin configuration reference"
      url: /reference/admin_configuration/
chat-file-uploads:
  name: "Chat file uploads"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Lets users attach files directly to a chat so the conversation can use uploaded content as context."
  why: "Use this when users need a fast path from a question to a document-grounded answer without first managing a workspace. Disable or role-gate it when uploads must follow a governed workspace intake process."
  default_state: "Enabled"
  admin_tab: workspaces
  setting_keys:
    - enable_chat_file_uploads
  guides:
    - title: "Upload documents in chat"
      url: /guides/upload-documents-in-chat/
  reference:
    - title: "Chat interface reference"
      url: /reference/chat-controls/
conversation-productivity:
  name: "Conversation productivity controls"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Controls chat navigation, appearance, drawers, notifications, and audio cues around conversation work."
  why: "Use these controls to make the chat surface easier to scan and revisit as histories grow. They do not change model behavior, so keep them focused on usability preferences rather than retrieval or security decisions."
  visual_sections:
    - heading: "Return to useful work and hand it off deliberately"
      text: >-
        Navigation and contents help you find an earlier exchange; references,
        handoffs, forks, and exports let you reuse it in different ways. A private
        conversation reference supplies bounded context, not permission to read
        another person's chat. Sending work to another conversation is an
        intentional action, not an automatic consequence of opening it.
      media_id: slide-conversation-reuse
  default_state: "Mixed"
  admin_tab: appearance
  setting_keys:
    - enable_conversation_contents_drawer
    - enable_left_nav_default
    - enable_dark_mode_default
    - enable_desktop_notifications
    - enable_chat_completion_audio_cues
  guides:
    - title: "Update profile preferences"
      url: /guides/update-profile-preferences/
    - title: "Reference and send between conversations"
      url: /guides/reference-and-send-conversations/
    - title: "Fork a conversation"
      url: /guides/fork-a-conversation/
    - title: "Export a conversation"
      url: /guides/export-a-conversation/
  reference:
    - title: "Chat interface reference"
      url: /reference/chat-controls/
collaborative-conversations:
  name: "Collaborative conversations"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Allows shared conversation participation so multiple users can work in the same chat context."
  why: "Use this when teams need a shared trail for decisions, prompts, and responses instead of copying transcripts around. Avoid it for private analysis where messages and source context should stay personal."
  visual_sections:
    - heading: "Share the discussion, not every participant's permissions"
      text: >-
        Participants can work through one question and see the conversation's
        shared messages and eligible files. Deliberately review what you bring
        into that shared context: private agents, credentials, and source access
        are not transferred to everyone who joins. Shared output and permission
        to open the original source are different things.
      media_id: slide-collaborative-conversations
  default_state: "Enabled"
  admin_tab: workspaces
  setting_keys:
    - enable_collaborative_conversations
  guides:
    - title: "Collaborate in a conversation"
      url: /guides/collaborate-in-a-conversation/
  reference:
    - title: "Chat interface reference"
      url: /reference/chat-controls/
grounded-document-search:
  name: "Grounded document search"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Controls Azure AI Search-backed retrieval, cached search results, and how chat grounds answers in selected documents and spreadsheets."
  why: "Use this when answers must be grounded in workspace documents and citations rather than only model memory. Grounding across documents and spreadsheets follows Enhanced Citations, which provides the spreadsheet engine; the remaining choice is whether chats that search without selected files also look for relevant spreadsheets, which adds a search and can add model calls."
  visual_sections:
    - heading: "Choose the knowledge boundary before asking"
      text: >-
        Personal, group, and public workspaces offer different collections of
        permitted knowledge. Choose the sources appropriate to the task, then
        inspect the evidence actually returned. Public workspaces broaden
        visibility to signed-in application users; they are not anonymous
        websites, and a search selection does not grant access to new sources.
      media_id: slide-workspace-scopes
  default_state: "Mixed"
  admin_tab: knowledge
  setting_keys:
    - enable_ai_search_apim
    - enable_search_result_caching
    - enable_mixed_source_chat_search
    - enable_mixed_source_conversation_continuity
    - enable_mixed_source_relevance_candidates
  reference:
    - title: "Chat interface reference"
      url: /reference/chat-controls/
source-history-summaries:
  name: "Source history summaries"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Summarizes older conversation context so search and long-running chats can keep useful history."
  why: "Use this when grounded follow-up questions need relevant prior context after the raw conversation window is too large. Leave it off when strict verbatim history is required or summarization cost is not justified."
  visual_sections:
    - heading: "Keep continuity without treating a summary as the original"
      text: >-
        Summarized history, explicit conversation references, and exports are
        different ways to reuse prior work. A summary is a lossy aid to
        continuity, not a verbatim transcript or a fresh check of the underlying
        documents. Return to the recorded messages and evidence when precise
        wording or provenance matters.
      media_id: slide-conversation-reuse
  default_state: "Disabled"
  admin_tab: knowledge
  setting_keys:
    - enable_summarize_content_history_beyond_conversation_history_limit
    - enable_summarize_content_history_for_search
  reference:
    - title: "Chat interface reference"
      url: /reference/chat-controls/
enhanced-citations:
  name: "Enhanced citations"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Adds richer source previews and storage-backed citation rendering for documents used in answers."
  why: "Use this when users need to inspect the exact source content behind an answer, especially with Office files, media transcripts, or generated previews. It adds storage and mount dependencies, so standard citations may be enough for simple deployments."
  visual_sections:
    - heading: "Follow an answer back to its supporting material"
      text: >-
        Open a citation to inspect the source passage rather than relying on
        the answer's wording alone. Enhanced previews depend on the source
        format, retained content, and configured storage. A citation helps you
        review support for a claim; it is not proof that every conclusion is
        correct or that all relevant sources were considered.
      media_id: slide-citations
  default_state: "Disabled"
  admin_tab: chat
  setting_keys:
    - enable_enhanced_citations
    - enable_enhanced_citations_mount
  reference:
    - title: "Feature reference"
      url: /reference/features/
chat-memory:
  name: "Chat memory"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Lets standard chat recall a user's saved instruction and fact memories, and lets the assistant save, change, or remove them on request."
  why: "Use this when users repeatedly restate the same context, or when response preferences such as tone, format, or naming should persist without building a custom agent. It is a chat capability rather than an agent action, so it does not require agents or actions to be enabled. Leave it off where per-user retained context is not acceptable; memories persist across conversations, so they are not a place for secrets or regulated data."
  visual_sections:
    - heading: "Separate retained memories from interface preferences"
      text: >-
        Instruction and fact memories can carry useful context across
        conversations. Theme, voice, and audio preferences personalize the
        interface separately. Review and remove retained memories when they no
        longer apply, and do not store secrets in them. Neither a memory nor a
        personal preference overrides organization policy or source permissions.
      media_id: slide-memory-and-preferences
  default_state: "Enabled"
  admin_tab: chat
  setting_keys:
    - enable_fact_memory_plugin
  guides:
    - title: "Update profile preferences"
      url: /guides/update-profile-preferences/
  reference:
    - title: "Fact memory action"
      url: /reference/actions/fact-memory/
web-search:
  name: "Web search"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Adds current public evidence through Foundry Grounding with Bing Search or V2 Microsoft Web IQ, including policy-controlled news and media discovery."
  why: "Use this when users need current public information that is not in workspace documents. Do not use it for sensitive prompts unless users understand that the current message can be sent to Bing for search."
  visual_sections:
    - heading: "Discover public sources before reviewing their claims"
      text: >-
        Web search discovers current public results; pasted URL access and
        deeper source review are separate capabilities. The current request can
        be sent to Bing through the configured search service. Review citations
        and dates, and keep sensitive workspace details out of a public-web
        query unless your policy permits them.
      media_id: slide-external-research
  default_state: "Disabled"
  admin_tab: knowledge
  setting_keys:
    - enable_web_search
    - enable_web_search_user_notice
    - web_search_provider
    - web_iq_consent_accepted
    - web_iq_news_enabled
    - web_iq_image_mode
    - web_iq_video_mode
  guides:
    - title: "Use web search in chat"
      url: /guides/use-web-search/
  reference:
    - title: "Chat interface reference"
      url: /reference/chat-controls/
url-access:
  name: "URL access"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Lets chat and workflows fetch approved pasted URLs under admin-controlled limits and domain policy."
  why: "Use this when links are the natural way to bring source pages into an answer. Keep allowlists, blocklists, and URL counts tight because external pages are untrusted input and can change outside your workspace governance."
  visual_sections:
    - heading: "Bring a specific page into the investigation"
      text: >-
        Use a pasted URL when you already know which source to inspect; use
        search when you need to discover sources. Fetching still follows the
        deployment's destination and resource limits. A permitted page remains
        untrusted input, and the ability to fetch it is not an endorsement of
        its instructions or claims.
      media_id: slide-external-research
  default_state: "Disabled"
  admin_tab: knowledge
  setting_keys:
    - enable_url_access
  guides:
    - title: "Review pasted URLs"
      url: /guides/review-pasted-urls/
  reference:
    - title: "Chat interface reference"
      url: /reference/chat-controls/
deep-research:
  name: "Deep research and source review"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Adds bounded source-page review and deeper web evidence inspection before web-grounded answers are used."
  why: "Use this when snippets are not enough and users need inspected pages, source trails, and controlled traversal. It should stay bounded by page, depth, rendering, and domain policy because it can fetch more external content than basic web search."
  visual_sections:
    - heading: "Distinguish discovery from inspected evidence"
      text: >-
        A search result is a starting point, not the same as reading its page.
        Source review inspects permitted pages, while deeper review follows a
        bounded trail. Read the resulting evidence and limitations: blocked,
        unavailable, or unvisited pages cannot support a claim of exhaustive
        research, and optional web tools do not inherit workspace trust.
      media_id: slide-external-research
  default_state: "Mixed"
  admin_tab: knowledge
  setting_keys:
    - enable_source_review
    - enable_deep_source_review
  guides:
    - title: "Use deep research"
      url: /guides/use-deep-research/
  reference:
    - title: "Chat interface reference"
      url: /reference/chat-controls/
personal-workspace:
  name: "Personal workspaces"
  area: "Documents and workspaces"
  audience: "End users"
  summary: "Gives each user a personal document workspace for uploads, tags, prompts, agents, actions, and workflows where enabled."
  why: "Use this as the default document management area for individual knowledge work. Disable it only in deployments that require all documents to live in managed group or public spaces."
  visual_sections:
    - heading: "Keep personal knowledge separate from deliberate sharing"
      text: >-
        Your personal workspace keeps your document collection separate from
        other users' collections. Use group knowledge when a team should manage
        the same material. If you deliberately share a conversation or its
        outputs, review what those outputs contain; personal source isolation
        does not make an already-shared answer private again.
      media_id: slide-personal-workspace
  default_state: "Enabled"
  admin_tab: workspaces
  setting_keys:
    - enable_user_workspace
  guides:
    - title: "Create and manage tags"
      url: /guides/create-and-manage-tags/
    - title: "Use tags in chat"
      url: /guides/use-tags-in-chat/
group-workspaces:
  name: "Group workspaces"
  area: "Documents and workspaces"
  audience: "End users"
  summary: "Enables shared group spaces, group creation, and approval-aware file sharing between groups."
  why: "Use this when teams need shared documents, prompts, agents, and group-owned workflows with role-aware access. The file-sharing toggle is best for cross-team collaboration where the receiving group should approve content before it becomes searchable."
  visual_sections:
    - heading: "Give a team a managed knowledge collection"
      text: >-
        Group roles separate membership management, document maintenance, and
        use of the team's knowledge. Choose a group for material the team
        should maintain together, rather than copying personal collections.
        Prompts, agents, actions, and workflows still depend on their own
        availability and management permissions.
      media_id: slide-group-workspaces
    - heading: "Review shared access without transferring ownership"
      text: >-
        File sharing can require the receiving group to approve an offered
        document before use. Accepting a shared reference is not ownership of
        the original: removal of that reference, deletion of the source, and
        redistribution are different operations with different permissions.
      media_id: slide-file-sharing
  default_state: "Mixed"
  admin_tab: workspaces
  setting_keys:
    - enable_group_workspaces
    - enable_group_creation
    - enable_file_sharing
  guides:
    - title: "Manage group workspaces"
      url: /guides/manage-group-workspaces/
    - title: "Review approval requests"
      url: /guides/review-approval-requests/
    - title: "Lock workspace scope"
      url: /guides/lock-workspace-scope/
public-workspaces:
  name: "Public workspaces"
  area: "Documents and workspaces"
  audience: "End users"
  summary: "Makes curated workspace knowledge available more broadly to signed-in SimpleChat users."
  why: "Use this for approved knowledge that should be discoverable beyond a single group. Public means broader visibility inside the authenticated application, not an anonymous public website; review the material accordingly."
  visual_sections:
    - heading: "Publish curated knowledge inside the application"
      text: >-
        Administrators and permitted document managers maintain the collection
        that signed-in users can consult. Review content before widening its
        audience and use personal or group scope for material that should stay
        restricted. A public workspace does not bypass sign-in or turn the
        application into an internet publishing service.
      media_id: slide-public-workspaces
  default_state: "Disabled"
  admin_tab: workspaces
  setting_keys:
    - enable_public_workspaces
  guides:
    - title: "Use public workspaces"
      url: /guides/use-public-workspaces/
file-sync:
  name: "File sync"
  area: "Documents and workspaces"
  audience: "End users"
  summary: "Lets enabled workspaces ingest content from configured storage sources instead of relying only on manual uploads."
  why: "Use this when workspace documents should track authoritative SMB, Azure Files, or Azure Blob sources. Scope-specific toggles let admins roll out sync gradually because credentials, schedules, and source ownership need governance."
  visual_sections:
    - heading: "Keep imported knowledge aligned with an approved source"
      text: >-
        Configure a permitted source, its filters, and its sync schedule instead
        of repeatedly uploading copies by hand. Source credentials authorize
        ingestion; the destination workspace governs who can use the imported
        copy. Check run outcomes and freshness rather than assuming a saved
        schedule proves the latest source changes were processed.
      media_id: slide-file-sync
  default_state: "Mixed"
  admin_tab: knowledge
  setting_keys:
    - enable_file_sync
    - enable_file_sync_group
    - enable_file_sync_personal
    - enable_file_sync_public
  guides:
    - title: "Create a file sync"
      url: /guides/create-a-file-sync/
document-access-index:
  name: "Document access index"
  area: "Documents and workspaces"
  audience: "Operators"
  summary: "Maintains a dedicated document-access index for faster authorization-aware document reads and validation."
  why: "Use this to keep document access checks fast and consistent as workspace content grows. Shadow validation and debug settings are rollout aids, not everyday user features, so operators should turn them on only while validating changes."
  default_state: "Mixed"
  admin_tab: scale
  setting_keys:
    - enable_document_access_index_cache
    - enable_document_access_index_container
    - enable_document_access_index_reads
    - enable_document_access_index_shadow_validation
    - enable_document_access_index_write_through
    - enable_startup_document_access_index_backfill
    - enable_dai_debug
  reference:
    - title: "Admin configuration reference"
      url: /reference/admin_configuration/
retention-policies:
  name: "Retention policies"
  area: "Documents and workspaces"
  audience: "Admins"
  summary: "Applies automatic retention rules separately for personal, group, and public workspace content."
  why: "Use this when conversations and documents need lifecycle enforcement instead of relying on manual cleanup. Configure each workspace type separately because personal drafts, group records, and public knowledge usually have different retention expectations."
  visual_sections:
    - heading: "Choose the right lifecycle control"
      text: >-
        Retention removes content according to configured rules. Conversation
        archiving, backup and restore, and selected-scope migration address
        different needs; none is a substitute for the others. Archiving is not
        legal hold, and a backup configuration is not proof of a tested recovery.
        Review each scope before applying deletion or recovery operations.
      media_id: slide-data-lifecycle
  default_state: "Disabled"
  admin_tab: backup-recovery
  setting_keys:
    - enable_retention_policy_group
    - enable_retention_policy_personal
    - enable_retention_policy_public
  reference:
    - title: "Admin configuration reference"
      url: /reference/admin_configuration/
document-extraction:
  name: "Document extraction"
  area: "Media and ingestion"
  audience: "End users"
  summary: "Controls Document Intelligence, enhanced extraction, formulas, and embedded Office image analysis during ingestion."
  why: "Use enhanced extraction when forms, scans, images, tables, or formulas need richer structure than standard text extraction. Keep cost and latency in mind because higher-fidelity extraction can be slower and depends on additional Azure services."
  visual_sections:
    - heading: "Turn supported files into inspectable knowledge"
      text: >-
        Ingestion extracts usable content, prepares searchable chunks and
        embeddings, and makes permitted material available to grounded answers.
        The route depends on file type and configured extraction services;
        audio, video, and richer visual extraction have separate prerequisites.
        Check processing results before expecting retrieval to find a file.
        Chunk sizes are configurable, not a universal value in this illustration.
      media_id: slide-feed-anything-get-knowledge
  default_state: "Mixed"
  admin_tab: knowledge
  setting_keys:
    - enable_document_intelligence_apim
    - enable_document_intelligence_formula_extraction
    - enable_enhanced_extraction
    - enable_office_embedded_image_analysis
  reference:
    - title: "Feature reference"
      url: /reference/features/
document-metadata-and-classification:
  name: "Document metadata and classification"
  area: "Media and ingestion"
  audience: "End users"
  summary: "Adds AI-assisted metadata extraction and category labels to workspace documents."
  why: "Use this when users need better filtering, review cues, or document summaries beyond filenames and tags. It is most useful for curated workspaces; small collections may not need the extra extraction step."
  visual_sections:
    - heading: "Carry useful labels into knowledge and conversation context"
      text: >-
        Metadata and classifications help people recognize, filter, and review
        documents and the context derived from them. Review AI-extracted values
        instead of treating them as authoritative records. Labels communicate
        handling expectations; they do not enforce permissions or replace
        workspace access checks and content-screening policy.
      media_id: slide-document-classification
  default_state: "Disabled"
  admin_tab: knowledge
  setting_keys:
    - enable_document_classification
    - enable_extract_meta_data
  reference:
    - title: "Feature reference"
      url: /reference/features/
chunk-size-overrides:
  name: "Chunk size overrides"
  area: "Media and ingestion"
  audience: "Admins"
  summary: "Lets admins override default extraction chunk sizes by file type for indexing and retrieval."
  why: "Use this when retrieval quality shows that default chunking is too coarse or too fragmented for your documents. Change it cautiously because reprocessing behavior, search relevance, and token cost are all affected."
  default_state: "Disabled"
  admin_tab: knowledge
  setting_keys:
    - enable_chunk_size_override
  reference:
    - title: "Admin configuration reference"
      url: /reference/admin_configuration/
media-file-ingestion:
  name: "Audio and video ingestion"
  area: "Media and ingestion"
  audience: "End users"
  summary: "Allows audio and video files to be processed into searchable transcript-style content."
  why: "Use this when meetings, recordings, or media assets hold knowledge that users should search and cite. Keep it disabled unless Speech or Video Indexer dependencies and processing costs are acceptable."
  visual_sections:
    - heading: "Make recordings searchable through extracted content"
      text: >-
        Enabled Speech and Video Indexer paths turn supported recordings into
        searchable transcript-style material. The answer uses what ingestion
        extracted, not an assumption that the model watched every frame or heard
        every detail. Inspect processing outcomes and source previews, especially
        when names, timing, or transcription accuracy matter.
      media_id: slide-feed-anything-get-knowledge
  default_state: "Disabled"
  admin_tab: knowledge
  setting_keys:
    - enable_audio_file_support
    - enable_video_file_support
  reference:
    - title: "Feature reference"
      url: /reference/features/
multimodal-vision:
  name: "Multimodal vision"
  area: "Media and ingestion"
  audience: "End users"
  summary: "Enables model-based visual analysis for images and visual document content."
  why: "Use this when image content itself matters, not just OCR text. It should be paired with clear model selection and safety expectations because visual analysis can add cost and may describe sensitive images."
  default_state: "Disabled"
  admin_tab: knowledge
  setting_keys:
    - enable_multimodal_vision
  reference:
    - title: "Feature reference"
      url: /reference/features/
tabular-analysis:
  name: "Tabular analysis"
  area: "Media and ingestion"
  audience: "End users"
  summary: "Runs structured CSV and spreadsheet analysis with durable planning, batching, checkpoints, and response controls."
  why: "Use this when users need computed answers, grouped results, exports, or charts from spreadsheet data rather than prose guesses. The many rollout flags exist because large workbook analysis needs reliability controls for planning, retries, batching, and durable checkpoints. The Analyze All Documents target stays off and hidden because no chat or workflow screen offers it yet."
  visual_sections:
    - heading: "Compute from the intended rows, not a sample"
      text: >-
        Schema inspection helps plan a calculation; the intended underlying rows
        must supply its totals and grouped results. Distinguish a computed table
        from the model's explanation and from an actual exported file. Check
        source coverage, worksheet selection, validation notices, and limitations
        before relying on the result. The illustrated data is synthetic, not a
        benchmark or a capacity promise.
      media_id: slide-tabular-analysis
  default_state: "Mixed"
  admin_tab: agents-actions
  setting_keys:
    - enable_analysis_deliverable_contract_telemetry
    - enable_mixed_source_analyze_all
    - enable_tabular_analyze_durable_preflight
    - enable_tabular_compact_response_protocol
    - enable_tabular_completion_driven_checkpointing
    - enable_tabular_durable_run_confirmation
    - enable_tabular_generation_balanced_batches
    - enable_tabular_generation_plan
    - enable_tabular_hierarchical_analysis
    - enable_tabular_independent_batch_retries
    - enable_tabular_mixed_deferred_composition_planning
    - enable_tabular_multifile_execution_unit_planning
    - enable_tabular_parity_contract_telemetry
    - enable_tabular_processing_plugin
    - enable_tabular_rolling_worker_pool
    - enable_tabular_search_shared_preflight
  reference:
    - title: "Tabular processing action"
      url: /reference/actions/tabular-processing/
document-compare:
  name: "Cross-format document compare"
  area: "Media and ingestion"
  audience: "End users"
  summary: "Compares a Source with one or more Targets, including documents and spreadsheets in the same comparison."
  why: "Use this when users need to review revisions or check the figures in a spreadsheet against a written document instead of reading each file by hand. Comparing documents with spreadsheets follows Enhanced Citations, which provides the spreadsheet engine; without it such a comparison is refused rather than treating the spreadsheet as text."
  visual_sections:
    - heading: "Choose a baseline and review the differences"
      text: >-
        Analyze reviews selected material against a question; Compare explains
        differences between a Source and one or more Targets. Choose the
        baseline deliberately, then inspect supporting passages and any partial
        coverage or validation notices. A fluent overview does not prove that
        every change was found, and a spreadsheet is not interchangeable with
        a narrative document.
      media_id: slide-analyze-and-compare
  default_state: "Follows Enhanced Citations"
  admin_tab: chat
  setting_keys:
    - enable_cross_format_compare
    - enable_cross_format_compare_one_to_many
  reference:
    - title: "Feature reference"
      url: /reference/features/
image-generation:
  name: "Image generation"
  area: "Media and ingestion"
  audience: "End users"
  summary: "Adds AI image creation from chat using the configured image generation model route."
  why: "Use this when users need generated visuals as part of ideation, explanation, or content creation. Keep approval and model routing clear because generated images have different safety, cost, and compliance considerations than text answers."
  visual_sections:
    - heading: "Use generated images as one kind of deliverable"
      text: >-
        Image generation creates a new visual through the configured image
        model. Charts and diagrams can instead represent computed data or
        structured content, so they are not all calls to the image service.
        When a plan requests images inside a report or presentation, verify
        both the image outcome and the final file; a suggested image is not a
        generated asset or an embedded file.
      media_id: slide-generated-deliverables
  default_state: "Disabled"
  admin_tab: ai-models
  setting_keys:
    - enable_image_generation
    - enable_image_gen_apim
  guides:
    - title: "Generate images"
      url: /guides/generate-images/
  reference:
    - title: "Chat interface reference"
      url: /reference/chat-controls/
agents:
  name: "Agents"
  area: "Agents and actions"
  audience: "End users"
  summary: "Provides focused assistants with reusable instructions, assigned knowledge, approved actions, and a chosen model."
  why: "Use this when users need specialized assistants with instructions, knowledge, actions, or reusable workflows. Keep basic chat available for simple questions; agents are most valuable when a task needs repeatable behavior or governed tools."
  visual_sections:
    - heading: "Equip one focused assistant for a defined task"
      text: >-
        An agent combines instructions, a model, assigned knowledge, and the
        actions it may use. The current ordinary agent runtime is
        **single-agent**; its retained multi-agent setting is derived runtime
        metadata, not a promise of several selectable coordination modes.
        A chat plan invoking an agent or a tool is distinct from multi-agent
        coordination and still follows enabled capabilities and permissions.
      media_id: slide-agents
  default_state: "Mixed"
  admin_tab: agents-actions
  setting_keys:
    - enable_semantic_kernel
    - enable_agent_template_gallery
    - enable_multi_agent_orchestration
  guides:
    - title: "Create an agent"
      url: /guides/create-an-agent/
    - title: "Create an agent with actions"
      url: /guides/create-an-agent-with-actions/
  reference:
    - title: "Actions reference"
      url: /reference/actions/
workflow-answer-completeness:
  name: "Workflow answer completeness"
  area: "Agents and actions"
  audience: "End users"
  summary: "Checks generated workflow answers against requested requirements and repairs omissions from available evidence before downstream use."
  why: "A schema-valid answer can omit requested facts. Independent checking catches that gap without replaying tools, and makes exhausted or unavailable verification visible."
  default_state: "Enabled"
  admin_tab: workflow
  setting_keys:
    - enable_workflow_completeness_check
  guides:
    - title: "Create a workflow"
      url: /guides/create-a-workflow/
  reference:
    - title: "Workflow settings"
      url: /admin/workflow/
orchestration-answer-completeness:
  name: "Orchestration answer completeness"
  area: "Chat"
  audience: "End users"
  summary: "Checks prepared orchestration content before delivery, with bounded grounded corrections and a check after every correction."
  why: "Use this to catch requested content missing from otherwise valid compositions before dependent steps or file renderers consume it. The shared allowance prevents format, visual and semantic repair loops from multiplying attempts."
  default_state: "Enabled"
  admin_tab: orchestration
  setting_keys:
    - enable_chat_orchestration_completeness_check
  guides:
    - title: "Use chat orchestration"
      url: /admin/orchestration/
  reference:
    - title: "Orchestration settings"
      url: /admin/orchestration/
workflow-ai-assistant:
  name: "AI workflow assistant"
  area: "Agents and actions"
  audience: "End users"
  summary: "Proposes plain-language edits to permitted personal or group workflows through the V2 editor's Ask AI tab. Changes are highlighted for review before saving, and Draft with AI can prepare task instructions."
  why: "Use this when authors know what a workflow should do but not which fields to set, for example \"run this at 7 AM on weekdays and only alert me when something is urgent\". It only proposes: the author reviews each change and saves through the normal checks, and it can't turn a workflow on, change Run as, sharing or approvals, or use documents, agents or models the author can't use."
  visual_sections:
    - heading: "Draft the repeatable process, then review the changes"
      text: >-
        Describe the intended trigger, work, and outcome to Ask AI, then review
        its highlighted edits in the workflow editor. Authoring assistance does
        not enable workflow access, save the definition, authorize Run as, or
        start a run. Confirm the chosen sources, required tools, and result
        destination before saving.
      media_id: slide-workflows
  default_state: "Enabled"
  admin_tab: workflow
  setting_keys:
    - enable_workflow_ai_assistant
  guides:
    - title: "Create a workflow"
      url: /guides/create-a-workflow/
  reference:
    - title: "Workflow settings"
      url: /admin/workflow/
agent-action-ai-assistant:
  name: "Ask AI in the agent and action editors"
  area: "Agents and actions"
  audience: "End users"
  summary: "Adds an Ask AI panel to the V2 agent and action editors for personal, group and global agents and actions. A person describes what they want, and the assistant fills in the unsaved draft, such as instructions, model, assigned actions and knowledge for an agent, or the type, configuration and sign-in method for an action. Each change is highlighted and can be undone by turn. The agent assistant can also draft new actions for the agent, which are created only when the agent is saved."
  why: "Use this when people know what an agent or connector should do but not which fields to set, for example \"build a helpdesk agent that searches our IT policies and can look up tickets\". Nothing is saved until the person saves, the usual checks still run, and the assistant never sees or enters keys, secrets or other credentials."
  visual_sections:
    - heading: "Build from a draft without skipping review"
      text: >-
        Start with an approved template or describe the assistant you need.
        Review the proposed instructions, model, knowledge, and actions before
        saving. Ask AI edits the unsaved draft and allows changes to be undone;
        it does not enter credentials, grant source access, or publish an agent
        merely because the proposal looks complete.
      media_id: slide-agent-builder
  default_state: "Enabled"
  admin_tab: agents-actions
  setting_keys:
    - enable_agent_ai_assistant
    - enable_action_ai_assistant
  guides:
    - title: "Create an agent"
      url: /guides/create-an-agent/
    - title: "Create an action"
      url: /guides/create-an-action/
  reference:
    - title: "Agents and actions settings"
      url: /admin/agents-actions/
workflow-results-in-chat:
  name: "Workflow results in chat"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Answers questions in chat from the stored result of one of your finished personal workflow runs, without re-running the workflow."
  why: "Use this when a workflow, such as a weekly digest, has already done the work and you want to ask about what it found. The answer uses only that run's saved output, stays in your private chats, and says which run it came from. Access follows the workflow and run, not a fresh check of every source document."
  visual_sections:
    - heading: "Discuss a saved run without replaying it"
      text: >-
        Follow-up uses the selected finished personal run's retained output.
        It does not rerun connectors, refresh changed documents, or prove that
        the saved conclusion is still current. Deleting the run, changing its
        saved result, or losing workflow/run access can make follow-up
        unavailable. Results delivery, alerts, and asking about a saved run
        remain separate choices.
      media_id: slide-durable-workflows
  default_state: "Disabled"
  admin_tab: workflow
  setting_keys:
    - enable_chat_workflow_results
  guides:
    - title: "Ask about workflow results"
      url: /guides/ask-about-workflow-results/
  reference:
    - title: "Workflow settings"
      url: /admin/workflow/
    - title: "Chat interface controls"
      url: /reference/chat-controls/
workflow-alert-sounds:
  name: "Workflow alert sounds"
  area: "Workflow automation"
  audience: "Admins and end users"
  summary: "Lets workflow alert rules play a bundled sound once or repeat it until a must-acknowledge alert is acknowledged."
  why: "Use this when pop-up workflow alerts need an audible cue for urgent runs, but leave it off in open offices, shared screens or environments with strict accessibility policies. Alerts still appear and still require acknowledgment, and each person can also use the per-device Play alert sounds switch in their browser."
  visual_sections:
    - heading: "Add an audible cue without changing the alert's meaning"
      text: >-
        Alert rules decide which run outcomes need attention; sound only adds
        a cue on the user's device. Acknowledgment records the human response,
        not successful completion of the underlying task. Keep visible alerts
        useful when sounds are disabled, and use run history to investigate
        failures rather than treating a notification as the result itself.
      media_id: slide-durable-workflows
  default_state: "Enabled"
  admin_tab: workflow
  setting_keys:
    - enable_workflow_alert_sounds
  reference:
    - title: "Workflow settings"
      url: /admin/workflow/
core-actions:
  name: "Core actions"
  area: "Agents and actions"
  audience: "End users"
  summary: "Controls built-in action plugins for HTTP access, math, text transformation, time, waits, and embedding utilities."
  why: "Use these actions to give agents small, predictable tools for common tasks without building custom integrations. Disable tools that are not needed in your environment, especially HTTP access, because actions expand what an agent can do beyond plain chat."
  visual_sections:
    - heading: "Connect an assistant to a bounded operation"
      text: >-
        Built-in utilities and separately configured connectors let an
        assistant do specific work instead of only describing it. Review which
        actions are assigned, the identity they use, their destinations, and
        whether they can change data. Enabling agents does not grant every
        connector or authorize unrestricted outbound requests.
      media_id: slide-approved-actions
    - heading: "Keep Microsoft 365 connection and action consent distinct"
      text: >-
        Microsoft 365 connectors have their own configuration and permissions;
        they are not enabled by the core utility switches below. Connecting an
        account, sharing data with a conversation, approving workflow Run as,
        and sending an outgoing action are separate decisions. The configured
        Teams experience is a personal tab, not a promise of a channel bot.
      media_id: slide-microsoft-365-and-teams
  default_state: "Mixed"
  admin_tab: agents-actions
  setting_keys:
    - enable_default_embedding_model_plugin
    - enable_http_plugin
    - enable_math_plugin
    - enable_text_plugin
    - enable_time_plugin
    - enable_wait_plugin
  guides:
    - title: "Create an action"
      url: /guides/create-an-action/
    - title: "Use Microsoft 365 conversation data"
      url: /guides/microsoft-365-conversation-data/
    - title: "Use SimpleChat in Microsoft Teams"
      url: /guides/microsoft-teams-app/
  reference:
    - title: "Smart HTTP action"
      url: /reference/actions/smart-http/
    - title: "All actions"
      url: /reference/actions/
    - title: "Embedding model action"
      url: /reference/actions/embedding-model/
    - title: "Fact memory action"
      url: /reference/actions/fact-memory/
    - title: "Math action"
      url: /reference/actions/math/
    - title: "Text action"
      url: /reference/actions/text/
    - title: "Time action"
      url: /reference/actions/time/
    - title: "Wait action"
      url: /reference/actions/wait/
mcp-governance:
  name: "MCP destination governance"
  area: "Agents and actions"
  audience: "Admins"
  summary: "Limits which remote MCP servers personal, group, and global actions may reach, using destination policies that name a server, host, URL, preset, or transport and the people they apply to."
  why: "Use this once remote MCP actions are allowed and people should only reach servers you have approved. Write policies for the servers already in use before enforcing, because with enforcement on and no matching policy every remote MCP action is refused."
  visual_sections:
    - heading: "Govern capability, destination, and operation separately"
      text: >-
        A person may be allowed to use an action without being allowed to reach
        every MCP server. Match destination policy to the approved server and
        intended people before enforcing it. Destination permission is not
        source authorization or consent to change external data; the connected
        identity and the operation's review requirements still apply.
      media_id: slide-governance
  default_state: "Disabled"
  admin_tab: governance
  setting_keys:
    - enable_mcp_destination_governance
  reference:
    - title: "Actions reference"
      url: /reference/actions/
    - title: "MCP action"
      url: /reference/actions/mcp/
content-safety:
  name: "Content safety"
  area: "Governance and safety"
  audience: "Admins"
  summary: "Checks submitted chat text and optional AI replies through Azure AI Content Safety."
  why: "Use independent input and output controls to catch harmful chat text. Choose when replies are shown and how scanner outages are handled; administrators can recheck messages that could not be inspected."
  visual_sections:
    - heading: "Configure the checkpoint rather than assuming universal coverage"
      text: >-
        Content Safety assesses configured chat inputs and optional replies.
        Content Screening applies a separate set of rules, and the model
        provider's filtering is another layer. Review which checkpoints are
        enabled, when replies become visible, and what happens if a check
        cannot run. A service being configured does not mean every file and
        every response was inspected.
      media_id: slide-safety-and-screening
  default_state: "Disabled"
  admin_tab: security
  setting_keys:
    - enable_content_safety
    - enable_content_safety_chat_input
    - enable_content_safety_chat_output
    - enable_content_safety_apim
  reference:
    - title: "Admin configuration reference"
      url: /reference/admin_configuration/
content-screening:
  name: "Content screening and document review"
  area: "Governance and safety"
  audience: "Admins and workspace reviewers"
  summary: "Applies PII, regex, literal, and optional model checks to workspace uploads and selected chat checkpoints."
  why: "Use document holds for workspace knowledge and optional text checks for submitted messages or AI replies. Keep technical chat-check failures private while giving administrators a queue for rechecking them."
  visual_sections:
    - heading: "Route policy matches to the right review path"
      text: >-
        Screening can check workspace uploads and selected chat checkpoints
        using configured PII, literal, regex, and optional model rules.
        Document holds and chat-check outcomes are different review paths.
        Reviewers should inspect the matched evidence and the configured
        failure behavior; neither screening nor Content Safety is an
        always-on guarantee for every data path.
      media_id: slide-safety-and-screening
  default_state: "Disabled"
  admin_tab: security
  setting_keys:
    - enable_content_screening
    - enable_content_screening_workspace_uploads
    - enable_content_screening_chat_input
    - enable_content_screening_chat_output
  guides:
    - title: "Screen and review workspace documents"
      url: /guides/review-screened-documents/
    - title: "Recheck chat content"
      url: /guides/recheck-chat-content/
  reference:
    - title: "Content screening and safety settings"
      url: /admin/security/
    - title: "Review center"
      url: /guides/admin-review-center/
admin-review-ai-assistant:
  name: "AI assist in the Review center"
  area: "Governance and safety"
  audience: "Admins"
  summary: "Suggests reviews for user feedback and safety violations in the V2 Review center: an analysis of one record in its editor, or a triage of many whose suggestions wait in an AI suggestions queue for a reviewer to approve, edit or dismiss."
  why: "Use this when reviewers face more feedback or flagged content than they can read closely, so routine records such as praise, false positives and first minor breaches are cleared quickly and attention goes to the rest. The model never saves or acts: a warning is sent, or a suspension or block requested, only when a reviewer approves a suggestion, a suspension or block still needs a second reviewer, and records reach the model without names, email addresses or ids."
  default_state: "Disabled"
  admin_tab: security
  setting_keys:
    - enable_admin_review_ai_assistant
  guides:
    - title: "Use the Review center"
      url: /guides/admin-review-center/
    - title: "Review user feedback"
      url: /guides/admin-review-feedback/
    - title: "Review safety violations"
      url: /guides/admin-review-safety-violations/
  reference:
    - title: "Security settings"
      url: /admin/security/
notices-and-terms:
  name: "Notices and terms of use"
  area: "Governance and safety"
  audience: "End users"
  summary: "Shows AI notices and terms-of-use acknowledgement prompts to users."
  why: "Use this when the app needs explicit user-facing policy language before or during use. Keep messages concise and operationally maintained, because stale legal or AI-use notices reduce trust."
  default_state: "Disabled"
  admin_tab: appearance
  setting_keys:
    - enable_ai_notice
    - enable_terms_of_use
  reference:
    - title: "Admin configuration reference"
      url: /reference/admin_configuration/
feedback-and-archiving:
  name: "Feedback and conversation archiving"
  area: "Governance and safety"
  audience: "End users"
  summary: "Collects assistant-response feedback for review, offers a separate Support feedback form, and can retain conversation archives."
  why: "Use response feedback to give reviewers a concrete answer and explanation to investigate. The Support feedback form prepares an email draft instead. Configure archiving separately when retained conversation copies are needed; it is not legal hold or automatic model retraining."
  visual_sections:
    - heading: "Turn response feedback into a reviewed improvement"
      text: >-
        A rating and explanation help an authorized reviewer understand what
        happened and decide whether to investigate, retest, or record follow-up.
        This loop does not automatically retrain a model or change settings.
        Use the response's feedback controls for answer quality; the Support
        email-draft form is a separate route for contacting your support team.
      media_id: slide-feedback
  default_state: "Mixed"
  admin_tab: help
  setting_keys:
    - enable_user_feedback
    - enable_support_send_feedback
    - enable_conversation_archiving
  guides:
    - title: "Send feedback"
      url: /guides/send-feedback/
    - title: "Review response feedback"
      url: /guides/admin-review-feedback/
  reference:
    - title: "Backup, recovery, and conversation archiving"
      url: /admin/backup-recovery/
support-menu:
  name: "Support menu and latest features"
  area: "Governance and safety"
  audience: "End users"
  summary: "Adds the support menu, latest-feature pages, and optional documentation links for in-app help."
  why: "Use this when users need discoverable help and release guidance inside SimpleChat. Documentation links should be enabled only when the linked docs are ready for your audience and deployment path."
  default_state: "Mixed"
  admin_tab: help
  setting_keys:
    - enable_support_latest_feature_documentation_links
    - enable_support_latest_features
    - enable_support_menu
  reference:
    - title: "Feature reference"
      url: /reference/features/
custom-navigation:
  name: "Custom pages and external links"
  area: "Integrations"
  audience: "End users"
  summary: "Lets admins add trusted in-app custom pages and curated external navigation links."
  why: "Use custom pages for authenticated local guidance, dashboards, forms, or lightweight tools that belong beside chat. Use external links sparingly for trusted destinations; too many links turn the app navigation into a generic portal."
  default_state: "Disabled"
  admin_tab: appearance
  setting_keys:
    - enable_custom_pages
    - enable_external_links
  reference:
    - title: "Feature reference"
      url: /reference/features/
key-vault-secrets:
  name: "Key Vault secret storage"
  area: "Integrations"
  audience: "Operators"
  summary: "Stores configured secrets in Azure Key Vault and can remind operators about secret expiration."
  why: "Use this when secret handling should move out of app settings and into a managed vault with lifecycle reminders. It requires identity and vault setup, so file-based or Cosmos settings may be simpler for non-production experiments."
  default_state: "Disabled"
  admin_tab: security
  setting_keys:
    - enable_key_vault_secret_expiration_reminders
    - enable_key_vault_secret_storage
  reference:
    - title: "Admin configuration reference"
      url: /reference/admin_configuration/
app-maintenance-and-health:
  name: "App maintenance and health checks"
  area: "Platform and operations"
  audience: "Operators"
  summary: "Runs startup and recurring maintenance jobs and exposes optional external health-check behavior."
  why: "Use this so background upkeep such as indexing policy repair and access-index maintenance happens predictably. External and no-auth health checks should be exposed only when platform monitoring requires them and network controls are understood."
  default_state: "Mixed"
  admin_tab: operations
  setting_keys:
    - enable_app_maintenance
    - enable_startup_app_maintenance
    - enable_external_healthcheck
    - enable_no_auth_external_healthcheck
  reference:
    - title: "Admin configuration reference"
      url: /reference/admin_configuration/
logging-and-diagnostics:
  name: "Logging and diagnostics"
  area: "Platform and operations"
  audience: "Operators"
  summary: "Controls diagnostic logging, Application Insights global logging, mixed document and spreadsheet metrics, and user-visible file processing logs."
  why: "Use diagnostics when operators need to troubleshoot ingestion, settings, or runtime behavior. Keep verbose debug logging and the mixed document and spreadsheet metrics temporary because they increase log volume and operational cost."
  visual_sections:
    - heading: "Plan the telemetry route you actually need"
      text: >-
        Application diagnostics can support reliability, usage, and security
        investigations. Application Insights, service diagnostics, and any
        organizational monitoring or SIEM destination need their applicable
        configuration. The illustration is not a promise that every event is
        logged or forwarded by default. Review data exposure, retention, cost,
        and who can read the resulting logs.
      media_id: slide-logging
  default_state: "Mixed"
  admin_tab: operations
  setting_keys:
    - enable_appinsights_global_logging
    - enable_mixed_source_development_telemetry
    - enable_debug_logging
    - enable_file_processing_logs
  reference:
    - title: "Logging tags reference"
      url: /reference/logging-tags/
scale-and-cache:
  name: "Scale and cache"
  area: "Platform and operations"
  audience: "Operators"
  summary: "Enables Redis-backed scale-out support and cached conversation reads for faster hot paths."
  why: "Use Redis when multiple app instances need shared session and cache behavior. Conversation caching is useful for responsiveness, but operators should tune time-to-live values alongside consistency expectations."
  visual_sections:
    - heading: "Scale the bottleneck, not only the web tier"
      text: >-
        Shared sessions and cache behavior must be configured before adding
        application instances. Cosmos DB throughput, AI Search capacity, model
        quotas, extraction services, and background work have their own limits.
        Measure the constrained path and coordinate those resources; the slide
        does not establish a universal user-count or throughput guarantee.
      media_id: slide-scale
  default_state: "Mixed"
  admin_tab: scale
  setting_keys:
    - enable_redis_cache
    - enable_conversation_cache
  reference:
    - title: "Admin configuration reference"
      url: /reference/admin_configuration/
front-door-and-session-security:
  name: "Front Door and session controls"
  area: "Platform and operations"
  audience: "Operators"
  summary: "Supports Azure Front Door routing and optional idle-timeout behavior for browser sessions."
  why: "Use Front Door when the app sits behind that edge service and generated URLs or redirects need to respect it. Idle timeout is useful for shared or regulated environments, but can interrupt long reading sessions if set too aggressively."
  default_state: "Disabled"
  admin_tab: security
  setting_keys:
    - enable_front_door
    - enable_idle_timeout
  reference:
    - title: "Admin configuration reference"
      url: /reference/admin_configuration/
rate-limit-response-message:
  name: "Rate limit response message"
  area: "Platform and operations"
  audience: "Admins"
  summary: "Replaces the built-in HTTP 429 explanation with admin-authored Markdown shown wherever a request is throttled."
  why: "Use this when throttling is a planned capacity control rather than a fault, such as a deployment fronted by API Management, and users need to know the retry window or who to ask for more capacity. Leave it off when the built-in wording is sufficient, because a stale custom message is worse than a generic accurate one."
  default_state: "Disabled"
  admin_tab: security
  setting_keys:
    - enable_custom_rate_limit_message
  reference:
    - title: "Security settings"
      url: /admin/security/
thoughts-display:
  name: "Thoughts display"
  area: "Platform and operations"
  audience: "End users"
  summary: "Shows configured processing-thought information in supported chat flows."
  why: "Use this when users benefit from seeing how a request is being processed or which tool phase is underway. Disable it when a simpler answer-only experience is preferred or when internal processing details should stay hidden."
  default_state: "Enabled"
  admin_tab: appearance
  setting_keys:
    - enable_thoughts
  reference:
    - title: "Chat interface reference"
      url: /reference/chat-controls/
chat-orchestration:
  name: "Chat orchestration"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Plans a chat request on the user's behalf, so they describe what they want instead of choosing documents, searches, prompts, agents and models first."
  why: "Use this when users get worse answers because they had to decide how to research a question before they had seen any results. Keep plan approval on review while a deployment builds confidence, because a plan that runs automatically gives the user no chance to intervene before work starts. It reaches only capabilities that are separately enabled, so it grants no new access."
  visual_sections:
    - heading: "Review the route from goal to delivered outcome"
      text: >-
        A plan declares the needed **Gather**, **Reason**, and **Render** work
        using available sources and capabilities. Review its proposed work and
        outputs before approving it when review mode is in use. Agent or action
        invocation is one possible step, not a new multi-agent runtime. A planned
        file is not delivered until rendering succeeds, and Auto model choice
        is distinct from automatic plan approval.
      media_id: slide-orchestration
  default_state: "Disabled"
  admin_tab: orchestration
  setting_keys:
    - enable_chat_orchestration
    - enable_chat_orchestration_actions
    - enable_chat_orchestration_workflows
    - enable_chat_orchestration_workflow_runs
    - enable_chat_orchestration_workflow_run_wait
    - enable_chat_orchestration_workflow_handoff
    - enable_workflow_plan_replay
  guides:
    - title: "Review and edit orchestration plans"
      url: /guides/review-and-edit-orchestration-plans/
    - title: "Create files with orchestration"
      url: /guides/create-files-with-orchestration/
  reference:
    - title: "Orchestration settings"
      url: /admin/orchestration/
saved-prompts:
  name: "Saved prompts"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Reuses saved instructions and variables while keeping the current question separate."
  why: "Use a saved prompt for a recurring review, summary, or response format instead of rewriting instructions each time. It is lighter than an agent when the task does not need assigned tools or a specialized runtime."
  visual_sections:
    - heading: "Reuse instructions while keeping this request explicit"
      text: >-
        In V2, attach a prompt with the Prompt picker or `/`, fill its variables,
        and write the current question separately. Review the resolved preview,
        including any values filled from knowledge, before sending. Editing the
        attachment changes this message rather than the saved original.
        A prompt supplies instructions; it does not grant source or tool access.
      media_id: slide-saved-prompts
  guides:
    - title: "Use prompts in chat"
      url: /guides/use-prompts-in-chat/
  reference:
    - title: "Chat interface controls"
      url: /reference/chat-controls/
    - title: "Personal workspaces"
      url: /features/personal-workspace/
workflows:
  name: "Workflows"
  area: "Workflow automation"
  audience: "End users"
  summary: "Saves a repeatable process with explicit tasks, triggers, inputs, run history, and result delivery."
  why: "Use a workflow when a useful process should run again on demand, on a schedule, or after configured File Sync changes. Use exploratory chat when the next step cannot be defined in advance."
  visual_sections:
    - heading: "Define the trigger, work, and result together"
      text: >-
        Choose the runner, permitted inputs, and required capabilities, then
        decide where the outcome should appear. Manual runs, interval or calendar
        schedules, and configured File Sync triggers serve different needs.
        Personal and group workflows are separately enabled and are both off by
        default; an authoring assistant being available does not enable execution.
      media_id: slide-workflows
    - heading: "Make branches, data flow, and human decisions explicit"
      text: >-
        Structured workflows can declare branches, **For each / Collect** work,
        bounded **Repeat until** blocks, and approval checkpoints. Bind later
        tasks to the intended earlier outputs rather than assuming every prior
        answer is their input. Limits and validation still apply: a human approval
        cannot make missing evidence complete or repair invalid task output.
      media_id: slide-workflow-logic
    - heading: "Recover carefully and distinguish results from notifications"
      text: >-
        Native V2 workflows retain progress for durable execution; older
        non-durable definitions require an explicit upgrade. Queued work needs
        the background scheduler. Inspect saved run history and uncertain
        external actions before retrying. Result conversations, configured
        alerts, and optional private-chat follow-up are separate outcomes;
        discussing a saved result does not refresh its original sources.
      media_id: slide-durable-workflows
  default_state: "Disabled"
  admin_tab: workflow
  setting_keys:
    - allow_user_workflows
    - allow_group_workflows
  guides:
    - title: "Create a workflow"
      url: /guides/create-a-workflow/
    - title: "Trigger a workflow"
      url: /guides/trigger-a-workflow/
    - title: "Ask about workflow results"
      url: /guides/ask-about-workflow-results/
  reference:
    - title: "Workflow settings"
      url: /admin/workflow/
document-analysis:
  name: "Document analysis"
  area: "Media and ingestion"
  audience: "End users"
  summary: "Reviews selected documents against a question and retains findings, supporting passages, and limitations."
  why: "Use Analyze when you need a review across selected material rather than one matching search passage. Use Compare when the question is what changed between a baseline and its targets."
  visual_sections:
    - heading: "Read the findings and evidence, not just the overview"
      text: >-
        Ask a clear review question and select the intended sources. Read the
        answer, then inspect saved findings, cited passages, coverage, and
        validation notices. Structural validation is not independent factual
        verification or proof of exhaustiveness. **Ask about this analysis**
        discusses retained work without performing another source pass; request
        a new analysis when you need current documents checked again.
      media_id: slide-analyze-and-compare
  guides:
    - title: "Read and discuss saved Analyze results"
      url: /guides/analyze-results/
    - title: "Review and edit orchestration plans"
      url: /guides/review-and-edit-orchestration-plans/
  reference:
    - title: "Chat interface controls"
      url: /reference/chat-controls/
    - title: "Cross-format document compare"
      url: /features/document-compare/
    - title: "Tabular analysis"
      url: /features/tabular-analysis/
generated-deliverables:
  name: "Generated deliverables"
  area: "Media and ingestion"
  audience: "End users"
  summary: "Turns prepared findings and content into supported downloadable files and visuals."
  why: "Use this when the outcome must leave the chat as a usable report, presentation, dataset, or visual. Specify what must be delivered, not only what the answer should discuss."
  visual_sections:
    - heading: "Prepare the work once and verify each delivered output"
      text: >-
        Orchestration can reuse retained findings or prepared content across
        compatible outputs, including reports, slide decks, tables, and
        structured data. An explicit Render task creates a file; prose, a table,
        or a planned filename is not a download. Check each output's status and
        format limitations. Charts, diagrams, and generated images have
        different prerequisites, and publishing a file to a workspace is a
        separate authorized operation.
      media_id: slide-generated-deliverables
  guides:
    - title: "Create files with orchestration"
      url: /guides/create-files-with-orchestration/
    - title: "Generate images"
      url: /guides/generate-images/
  reference:
    - title: "Orchestration settings"
      url: /admin/orchestration/
    - title: "Chat interface controls"
      url: /reference/chat-controls/
workspace-scope-lock:
  name: "Workspace scope lock"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Keeps a grounded conversation tied to its recorded workspace scope instead of drifting to another source collection."
  why: "Use the scope indicator to understand why another workspace cannot be selected in this chat. Start a new conversation for a different source set when policy prevents unlocking."
  visual_sections:
    - heading: "Keep the source boundary intentional"
      text: >-
        After grounded results establish the conversation's scope, the lock
        indicator explains the recorded boundary. Administrators can enforce it
        so users cannot unlock that conversation. The lock does not freeze
        document contents, replace current source authorization, or universally
        constrain web, Microsoft 365, API, and MCP tools; those destinations
        retain their own policies.
      media_id: slide-workspace-scope-lock
  default_state: "Enforced"
  admin_tab: chat
  setting_keys:
    - enforce_workspace_scope_lock
  guides:
    - title: "Lock workspace scope in chat"
      url: /guides/lock-workspace-scope/
  reference:
    - title: "Chat settings"
      url: /admin/chat/
    - title: "Chat interface controls"
      url: /reference/chat-controls/
conversation-details:
  name: "Conversation details"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Shows recorded conversation context, including scope, state, documents, attribution, and an on-request summary."
  why: "Use conversation details to orient yourself before continuing a long thread or handing work to another person. Use message details when you need to inspect the evidence for one particular answer."
  visual_sections:
    - heading: "Inspect the context behind the thread"
      text: >-
        Open conversation details for the active chat to review the recorded
        context. In V2, source documents, related linked files, model and agent
        attribution, and the generated summary serve different purposes.
        A linked file does not prove every answer used it, and generating a
        summary is not a new source review. Available fields depend on what the
        conversation recorded.
      media_id: slide-conversation-details
  reference:
    - title: "Conversation header and details controls"
      url: /reference/chat-controls/
    - title: "Message details and sources"
      url: /features/message-details/
message-details:
  name: "Message details and sources"
  area: "Chat and retrieval"
  audience: "End users"
  summary: "Separates a reply's recorded attribution, source evidence, tool outcomes, and processing context from its prose."
  why: "Use message-level details when you need to know what an answer actually used, whether a tool succeeded, or why evidence is incomplete. An enabled capability is not proof that the reply invoked it."
  visual_sections:
    - heading: "Check one answer's evidence and recorded outcomes"
      text: >-
        In V2, inspect Details, Sources, and recorded processing information
        for the selected reply. Read document passages, web or tool references,
        and Microsoft 365 evidence where recorded, keeping failed operations
        distinct from successful results. Opening these panels does not rerun
        tools or reconstruct missing history. Processing information is not a
        model's hidden chain of thought or a guarantee of factual completeness.
      media_id: slide-message-details
  reference:
    - title: "Reply sources and tool outcomes"
      url: /reference/chat-controls/#reply-sources-and-tool-outcomes-v2-interface
    - title: "Conversation details"
      url: /features/conversation-details/
