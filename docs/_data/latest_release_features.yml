  release-260-agent-instruction-references:
    title: Reference Actions and Knowledge Directly in Agent Instructions
    description: Agent instructions can now name the exact actions and documents an agent holds using autocompleted hash-action
      and hash-knowledge tokens, and the agent builder reorders its steps so instructions come last.
    summary: Agent instructions can now name the exact actions and documents an agent holds using autocompleted hash-action
      and hash-knowledge tokens, and the agent builder reorders its steps so instructions come last.
    why: This matters because vague instructions are the most common reason an agent ignores a tool you gave it, and naming
      the capability directly removes that guesswork.
    icon: bi-robot
    accent: orange
    url: /latest-release/release-260-agent-instruction-references/
