  release-260-used-documents-fork:
    title: Used Documents View and Conversation Forking
    description: A Used Documents mode shows only the documents actually cited in a conversation, and you can fork a conversation
      from any response to explore a different direction.
    summary: A Used Documents mode shows only the documents actually cited in a conversation, and you can fork a conversation
      from any response to explore a different direction.
    why: This matters because long conversations accumulate a lot of context, and both knowing what was actually used and
      being able to branch without losing the thread are hard problems otherwise.
    icon: bi-journals
    accent: amber
    url: /latest-release/release-260-used-documents-fork/
