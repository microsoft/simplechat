      alt: Stepped Workflow Builder screenshot placeholder
      title: Stepped Workflow Builder
      caption: General, Trigger, Tasks, Reliability, and Review guide you through building a workflow.
      label: Builder Steps
    - path: /images/latest-release/release_260_workflow_task_sequences_2.png
      alt: Per-Task Model and Documents screenshot placeholder
      title: Per-Task Model and Documents
      caption: Each task picks its own model or agent and its own document action and targets.
      label: Task Setup
    - path: /images/latest-release/release_260_workflow_task_sequences_3.png
      alt: Alert Rules in the Review Step screenshot placeholder
      title: Alert Rules in the Review Step
      caption: Rules can notify on status, text match, regular expression, File Sync result, or an AI-judged condition.
