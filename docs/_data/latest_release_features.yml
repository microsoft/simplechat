  - release-250-multi-inline-image-gen
  - release-250-workspace-views
  - release-250-follow-up-actions
  - release-250-model-agent-avatars
  highlights:
  - Model and agent governance, workflow automation, File Sync, document extraction, and enterprise actions defined the v0.250.001
    feature set.
  - Chat productivity, workspace browsing, generated artifacts, source review, and profile improvements remain documented
    for teams still rolling out that release.
- id: archive_release
  label: Archive Release Features
  description: The v0.239.001 through v0.241.007 guides remain available for longer-term archive reference.
  badge: Archive release
  release_version: 0.239.001 - 0.241.007
  slugs:
  - guided-tutorials
  - background-chat
  - gpt-selection
  - tabular-analysis
  - citation-improvements
  - document-versioning
  - summaries-and-export
  - agent-operations
  - ai-transparency
  - fact-memory
  - deployment
  - redis-and-key-vault
  - send-feedback
  - support-menu
  - export-conversation
  - retention-policy
  - workspace-scope-lock
  - tags-grid-view-chat-filtering
  highlights:
  - Guided tutorials, background chat completion, and fact memory helped users onboard faster and carry useful context forward.
  - GPT selection, citation improvements, document versioning, and tabular analysis made core chat and document workflows
    more transparent.
  - Support Menu, Send Feedback, deployment guidance, and Redis/Key Vault setup improved the admin-to-user release communication
    loop.
  - Owner-only group agent management lets admins restrict group agent and action edits to group owners.
  - Multi-workspace scope management expanded grounded chat across personal, group, and public sources.
  - Tag folders, grid view, and chat filtering shipped together as one broader workspace workflow upgrade.
  bug_fixes:
  - Citation parsing fixes resolved edge cases where page range references failed to create the right clickable links.
  - Public workspace activation fixed a 403 path for non-owner users activating a public workspace for chat.
lookup:
  release-260-enhanced-extraction:
    title: Sharper Document Extraction with Figure Descriptions
    description: Enhanced extraction now reads charts, diagrams, and figures inside your documents and writes searchable descriptions
      of them, so answers can draw on pictures instead of skipping past them.
    summary: Enhanced extraction now reads charts, diagrams, and figures inside your documents and writes searchable descriptions
      of them, so answers can draw on pictures instead of skipping past them.
    why: This matters because a large share of the meaning in reports, decks, and scanned documents lives in pictures, and
      until now that content was effectively invisible to search.
    icon: bi-file-earmark-richtext
    accent: blue
    url: /latest-release/release-260-enhanced-extraction/
    release_label: Current Release
    release_version: 0.260.001
    image: /images/latest-release/release_260_enhanced_extraction_1.png
    image_alt: Upload a Document With Figures screenshot placeholder
    images:
    - path: /images/latest-release/release_260_enhanced_extraction_1.png
      alt: Upload a Document With Figures screenshot placeholder
      title: Upload a Document With Figures
      caption: Upload a report or deck that contains charts, diagrams, or scanned figures from Personal Workspace.
      label: Upload
    - path: /images/latest-release/release_260_enhanced_extraction_2.png
      alt: Check the Extraction Badge screenshot placeholder
      title: Check the Extraction Badge
      caption: The document row badge names the extraction engine that ran and explains any fallback.
      label: Extraction Badge
    - path: /images/latest-release/release_260_enhanced_extraction_3.png
      alt: Ask About a Chart screenshot placeholder
      title: Ask About a Chart
      caption: Ground a chat on the document and ask a question that can only be answered from a figure.
      label: Chart Answer
  release-260-office-embedded-images:
    title: Pictures Inside Word and PowerPoint Are Now Searchable
    description: Images embedded in Word and PowerPoint files, including SmartArt, Visio drawings, and chart graphics, are
      now analyzed and cited with the correct page or slide.
    summary: Images embedded in Word and PowerPoint files, including SmartArt, Visio drawings, and chart graphics, are now
      analyzed and cited with the correct page or slide.
    why: This matters because architecture diagrams, org charts, and process flows are often the whole point of a deck, and
      citations now point at the slide those visuals actually live on.
    icon: bi-image
    accent: teal
    url: /latest-release/release-260-office-embedded-images/
    release_label: Current Release
    release_version: 0.260.001
    image: /images/latest-release/release_260_office_embedded_images_1.png
    image_alt: Upload a Deck With Diagrams screenshot placeholder
    images:
    - path: /images/latest-release/release_260_office_embedded_images_1.png
      alt: Upload a Deck With Diagrams screenshot placeholder
      title: Upload a Deck With Diagrams
      caption: Word and PowerPoint files with SmartArt, Visio drawings, or charts are now fully analyzed.
      label: Deck Upload
    - path: /images/latest-release/release_260_office_embedded_images_2.png
      alt: Image Chunks With Slide Numbers screenshot placeholder
      title: Image Chunks With Slide Numbers
      caption: Each embedded image becomes its own citable chunk carrying the correct page or slide attribution.
      label: Image Chunks
    - path: /images/latest-release/release_260_office_embedded_images_3.png
      alt: Citation Points at the Slide screenshot placeholder
      title: Citation Points at the Slide
      caption: Answers drawn from a diagram cite the exact slide the visual appears on.
      label: Slide Citation
  release-260-workflow-task-sequences:
    title: Multi-Step Workflows With Alert Rules
    description: Workflows can now run an ordered sequence of tasks, each with its own model, agent, and documents, and can
      notify you through configurable alert rules instead of a single priority setting.
    summary: Workflows can now run an ordered sequence of tasks, each with its own model, agent, and documents, and can notify
      you through configurable alert rules instead of a single priority setting.
    why: This matters because real work is rarely one prompt, and chaining steps with targeted notifications turns a workflow
      into something you can trust to run unattended.
    icon: bi-diagram-3
    accent: violet
    url: /latest-release/release-260-workflow-task-sequences/
    release_label: Current Release
    release_version: 0.260.001
    image: /images/latest-release/release_260_workflow_task_sequences_1.png
    image_alt: Stepped Workflow Builder screenshot placeholder
    images:
