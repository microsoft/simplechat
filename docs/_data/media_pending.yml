# media_pending.yml
#
# Images that exist but are branded "Screenshot pending" placeholders rather
# than real captures. They ship so the pages render, but they are listed on
# /contributing/media-status/ so they are not silently forgotten.
#
# To resolve one: capture the real screenshot and overwrite the file at the
# listed path, then delete its entry here.

release_v0_260_001:
  label: "SimpleChat v0.260.001 Latest Features"
  note: "Remaining placeholder graphics. Each entry records why the capture could not be automated."
  items:
    - page: /latest-release/release-260-azure-blob-file-sync/
      images: 1
      path_pattern: "docs/images/latest-release/release_260_azure_blob_file_sync_3.png"
      note: "Sync status, counts, and history need a source that has actually completed a run."
    - page: /latest-release/release-260-conversation-contents-drawer/
      images: 2
      path_pattern: "docs/images/latest-release/release_260_conversation_contents_drawer_1.png .. _2.png"
      note: "The drawer button stays hidden until a conversation has enough messages."
    - page: /latest-release/release-260-conversation-context-grounding/
      images: 3
      path_pattern: "docs/images/latest-release/release_260_conversation_context_grounding_1.png .. _3.png"
      note: "Needs a conversation grounded on workspace documents."
    - page: /latest-release/release-260-message-audio-export/
      images: 3
      path_pattern: "docs/images/latest-release/release_260_message_audio_export_1.png .. _3.png"
      note: "Needs a message with generated audio to export."
    - page: /latest-release/release-260-public-workspace-display-name/
      images: 3
      path_pattern: "docs/images/latest-release/release_260_public_workspace_display_name_1.png .. _3.png"
      note: "The scope selector and navigation only show the custom label once the admin setting is saved."
    - page: /latest-release/release-260-terms-of-use/
      images: 2
      path_pattern: "docs/images/latest-release/release_260_terms_of_use_1.png .. _2.png"
      note: "The interstitial redirects to the home page unless enable_terms_of_use is saved. Image 3 is captured."
    - page: /latest-release/release-260-used-documents-fork/
      images: 3
      path_pattern: "docs/images/latest-release/release_260_used_documents_fork_1.png .. _3.png"
      note: "Needs a conversation that cited workspace documents."
